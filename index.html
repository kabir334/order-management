<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Order Management</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <section id="loginScreen" class="screen active">
        <div class="card login-card">
          <div class="brand-wrap">
            <span class="brand-badge">OM</span>
            <h1>Order Management</h1>
          </div>

          <form id="loginForm" class="stack-form">
            <label>
              <span>Username</span>
              <input id="username" type="text" name="username" autocomplete="username" required />
            </label>

            <label>
              <span>Password</span>
              <input id="password" type="password" name="password" autocomplete="current-password" required />
            </label>

            <button type="submit" class="primary-button">Login</button>
          </form>
        </div>
      </section>

      <section id="mainScreen" class="screen">
        <header class="topbar">
          <div>
            <p class="eyebrow">Order desk</p>
            <h2>New order</h2>
          </div>
          <button id="logoutBtn" class="ghost-button" type="button">Logout</button>
        </header>

        <div class="panel">
          <label class="text-area-label" for="orderInput">Paste order message</label>
          <textarea id="orderInput" rows="8" placeholder="name: Nafijul Islam&#10;phone: 01910186978&#10;Address: ..."></textarea>
          <button id="parseButton" class="secondary-button" type="button">Parse order</button>
        </div>

        <form id="orderForm" class="order-form">
          <div id="fieldGrid" class="field-grid"></div>

          <div class="submit-row">
            <button id="submitOrderBtn" type="submit" class="primary-button full-width">
              Submit order
            </button>
          </div>
        </form>
      </section>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="utils/orderFieldConfig.js"></script>
    <script src="utils/orderParser.js"></script>
    <script src="app.js"></script>
  </body>
</html>
